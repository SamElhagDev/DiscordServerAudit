bot:
  prefix: "!"

# The role name that grants access to all bot commands (exact match, case-sensitive)
admin_role: "Bot Admin"

# Channel IDs for audit output (set after bot joins server)
log_channel_id: 0         # General bot logs
audit_channel_id: 0       # Audit results posted here

# Scheduler intervals (in hours)
intervals:
  security_audit: 168      # How often to run security audit
  server_audit: 168       # How often to run server recommendations (168 = weekly)

# Security audit thresholds
security:
  max_admin_roles: 3              # Warn if more than this many roles have Administrator
  max_bot_permissions_threshold:  # Permissions bots should NOT have
    - administrator
    - manage_guild
    - ban_members
  warn_no_2fa: true               # Warn if server 2FA requirement is disabled
  warn_unverified_bots: true      # Warn about bots with no verified tag

# Server audit thresholds
server:
  inactive_channel_days: 14       # Days without a message = dead channel
  max_empty_channels: 5           # Warn if more than this many channels have no topic/description
  min_onboarding_channels:        # Channels that should exist by name (partial match)
    - welcome
    - rules
    - announcements

# Stats collection settings
stats:
  enabled: true                    # Master toggle for stats collection
  snapshot_interval_hours: 1       # How often to capture member snapshots
  retention_days: 7300             # Days of raw event data to keep. Rollup tables keep
                                   # long-term daily aggregates, so this only bounds the
                                   # raw message_events / voice_sessions tables. The next
                                   # daily rollup prunes raw rows older than this.
  track_reactions: true            # Whether to count reactions
  track_presence: false            # Count online members. Requires the privileged
                                   # "Presence Intent" enabled in the Discord Dev Portal;
                                   # while off, online metrics show N/A instead of 0.
  excluded_channels: []            # Channel IDs to exclude from tracking
  excluded_users: []               # User IDs to exclude (e.g., bots)
  exclude_bots: true               # Auto-exclude bot users from message/voice tracking

# Gemini settings (shared across features)
gemini:
  model: "gemini-3-flash-preview"         # Default Gemini model for summaries and insights

# Fact-check settings (emoji-triggered via reaction)
factcheck:
  enabled: true                    # Master toggle for fact-check feature
  emoji: "\U0001F50D"             # Emoji name or unicode char that triggers fact-check (magnifying glass)
  model: "gemini-3-flash-preview"  # Gemini model for fact-checking
  rate_limit: 5                    # Max fact-checks per user per hour
  cooldown_seconds: 300            # Seconds before same message can be re-checked
  timeout_seconds: 45              # Max seconds to wait for Gemini response (raised for multimodal)
  max_images: 4                    # Max images to include per fact-check
  max_image_bytes: 10485760        # Max size per image in bytes (10 MB)
  image_download_timeout: 5        # Seconds to wait per image download

  # Google Search grounding — verify claims against live web results.
  grounding:
    enabled: true                  # Enable Google Search grounding
    max_sources: 5                 # Max source links shown in the embed
    require_source_for_negative: true  # Downgrade "Mostly False" with 0 sources to "Unverifiable"

  # Conversational context — reference prior server messages (stored locally in SQLite).
  context:
    enabled: true                  # Store + use message context
    # storage
    storage_retention_days: 0      # Delete horizon. 0 = keep forever
    max_messages_per_channel: 0    # Per-channel row cap. 0 = unlimited
    max_stored_chars: 2000         # Truncate stored text to this length
    # recency tier (query window, never deletes)
    recency_window_hours: 168      # What counts as "recent" (7 days)
    max_context_messages: 25       # Max recent messages injected per check
    same_channel_limit: 15         # How many may come from the trigger channel
    # relevance tier (FTS5 over all retained history)
    history_relevance:
      enabled: true                # FTS5 relevance retrieval (auto-off if FTS5 missing)
      lookback_days: 0             # How far back FTS reaches. 0 = all history
      archive_max_messages: 10     # Max relevance messages injected per check
      min_score: 0.0               # bm25 floor. 0 = no floor
    # backfill (/factcheckrefresh)
    backfill_messages_per_channel: 0  # Max history messages pulled per channel
    backfill_channel_delay: 1    # Seconds between channels during backfill

# Performance tuning. Each toggle falls back to pre-006 behavior when disabled.
performance:
  # Batch the two per-message DB writes (message_events + message_context)
  # instead of writing one row at a time. Off = per-message writes.
  batch_writes:
    enabled: true
    max_rows: 50             # Flush after this many pending rows...
    max_interval_seconds: 2  # ...or this often, whichever comes first.
    # Best-effort: a hard crash may drop up to one interval of pending rows
    # (graceful shutdown always flushes). Set enabled:false for strict durability.

  # Parallelize fact-check image/reply fetch + context queries. Same results,
  # only faster local I/O — does not affect verdicts.
  fast_factcheck:
    enabled: true

  # Log gateway latency hourly (observability only).
  health:
    log_latency: true
