name: Discord Server Audit

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: powershell
    env:
      DiscordServerAudit_APP_ROOT: C:\apps\DiscordServerAudit
      DiscordServerAudit_APP_TASK: DiscordServerAudit
      DiscordServerAudit_TOKEN: ${{ secrets.DiscordServerAudit_TOKEN }}
      DiscordServerAudit_PREFIX: ${{ secrets.DiscordServerAudit_PREFIX }}
      DiscordServerAudit_DB_PATH: C:\apps\DiscordServerAudit\data\bot.db
      DiscordServerAudit_ADMIN_ROLE: ${{ secrets.DiscordServerAudit_ADMIN_ROLE }}
      DiscordServerAudit_LOG_CHANNEL_ID: ${{ secrets.DiscordServerAudit_LOG_CHANNEL_ID }}
      DiscordServerAudit_AUDIT_CHANNEL_ID: ${{ secrets.DiscordServerAudit_AUDIT_CHANNEL_ID }}
      DiscordServerAudit_GEMINI_KEY: ${{ secrets.DiscordServerAudit_GEMINI_KEY }}

    steps:
      - name: Clean workspace
        shell: powershell
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\.git") {
            Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\.git"
          }

      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8
          if (Test-Path 'requirements.txt') { python -m pip install -r requirements.txt }

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Create data directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path $env:DiscordServerAudit_DB_PATH.Replace('\bot.db','') -Force | Out-Null

      # 1) Copy code to persistent folder
      - name: Deploy files to persistent folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path $env:DiscordServerAudit_APP_ROOT -Force | Out-Null
          $dst = Join-Path $env:DiscordServerAudit_APP_ROOT 'src'
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          robocopy "$env:GITHUB_WORKSPACE" "$dst" /MIR /NFL /NDL /NP /NJH /NJS /XD ".git" ".github" ".venv" "__pycache__" ".pytest_cache" ".mypy_cache" ".vs" ".vscode" /XF "Dockerfile" "docker-compose.yml"
          $code = $LASTEXITCODE
          if ($code -ge 8) { Write-Error "robocopy failed with exit code $code"; exit $code }
          Write-Host "robocopy exit code $code (OK)"; exit 0

      # 2) Create/update venv and install deps
      - name: Create/Update venv and install requirements
        run: |
          $venv = Join-Path $env:DiscordServerAudit_APP_ROOT '.venv'
          $venvPy = "$venv\Scripts\python.exe"

          if (Test-Path $venv) {
            $healthy = $false
            try { $healthy = (& $venvPy --version 2>&1) -match 'Python 3' } catch {}
            if (-not $healthy) {
              Write-Host "Venv Python is stale or broken - recreating..."
              Remove-Item -Recurse -Force $venv
            }
          }

          if (-not (Test-Path $venv)) { py -3.10 -m venv $venv }
          & $venvPy -m pip install --upgrade pip wheel
          if (Test-Path "$env:DiscordServerAudit_APP_ROOT\src\requirements.txt") {
            & $venvPy -m pip install -r "$env:DiscordServerAudit_APP_ROOT\src\requirements.txt"
          }

      # 3) Write run-bot.ps1
      - name: Create run-bot.ps1
        shell: powershell
        run: |
          $app    = "$env:DiscordServerAudit_APP_ROOT\src"
          $venvPy = "$env:DiscordServerAudit_APP_ROOT\.venv\Scripts\python.exe"
          $lines = @()
          $lines += "`$ErrorActionPreference = 'Continue'"
          $lines += "Set-Location '$app'"
          $lines += 'if (-not $env:DiscordServerAudit_TOKEN -and (Test-Path ".env")) {'
          $lines += '  Get-Content ".env" | ForEach-Object {'
          $lines += "    if (`$_ -match '^\s*#') { return }"
          $lines += "    if (`$_ -match '^\s*$') { return }"
          $lines += "    `$k,`$v = `$_ -split '=', 2"
          $lines += '    [Environment]::SetEnvironmentVariable($k.Trim(), $v.Trim())'
          $lines += '  }'
          $lines += '}'
          $lines += "$venvPy -u bot.py"
          Set-Content -Path "$env:DiscordServerAudit_APP_ROOT\run-bot.ps1" -Value ($lines -join "`r`n") -Encoding UTF8

      # 4) Set secrets as machine env vars
      - name: Set DiscordServerAudit_PREFIX as machine env var
        shell: powershell
        env:
          DiscordServerAudit_PREFIX: ${{ secrets.DiscordServerAudit_PREFIX }}
        run: |
          $prefix = if ($env:DiscordServerAudit_PREFIX) { $env:DiscordServerAudit_PREFIX } else { "!" }
          setx DiscordServerAudit_PREFIX "$prefix" /M | Out-Null

      - name: Set DiscordServerAudit_TOKEN as machine env var
        shell: powershell
        env:
          DiscordServerAudit_TOKEN: ${{ secrets.DiscordServerAudit_TOKEN }}
        run: |
          if (-not $env:DiscordServerAudit_TOKEN) { throw "Secret DiscordServerAudit_TOKEN is missing. Add it in Settings → Secrets → Actions." }
          setx DiscordServerAudit_TOKEN "$env:DiscordServerAudit_TOKEN" /M | Out-Null
          $m = [Environment]::GetEnvironmentVariable('DiscordServerAudit_TOKEN','Machine')
          if (-not $m) { throw "Failed to set machine env var DiscordServerAudit_TOKEN." }

      - name: Set DiscordServerAudit_ADMIN_ROLE as machine env var
        shell: powershell
        env:
          DiscordServerAudit_ADMIN_ROLE: ${{ secrets.DiscordServerAudit_ADMIN_ROLE }}
        run: |
          if (-not $env:DiscordServerAudit_ADMIN_ROLE) { throw "Secret DiscordServerAudit_ADMIN_ROLE is missing. Add it in Settings → Secrets → Actions." }
          setx DiscordServerAudit_ADMIN_ROLE "$env:DiscordServerAudit_ADMIN_ROLE" /M | Out-Null
          $m = [Environment]::GetEnvironmentVariable('DiscordServerAudit_ADMIN_ROLE','Machine')
          if (-not $m) { throw "Failed to set machine env var DiscordServerAudit_ADMIN_ROLE." }

      - name: Set DiscordServerAudit_LOG_CHANNEL_ID as machine env var
        shell: powershell
        env:
          DiscordServerAudit_LOG_CHANNEL_ID: ${{ secrets.DiscordServerAudit_LOG_CHANNEL_ID }}
        run: |
          if (-not $env:DiscordServerAudit_LOG_CHANNEL_ID) { throw "Secret DiscordServerAudit_LOG_CHANNEL_ID is missing. Add it in Settings → Secrets → Actions." }
          setx DiscordServerAudit_LOG_CHANNEL_ID "$env:DiscordServerAudit_LOG_CHANNEL_ID" /M | Out-Null
          $m = [Environment]::GetEnvironmentVariable('DiscordServerAudit_LOG_CHANNEL_ID','Machine')
          if (-not $m) { throw "Failed to set machine env var DiscordServerAudit_LOG_CHANNEL_ID." }

      - name: Set DiscordServerAudit_AUDIT_CHANNEL_ID as machine env var
        shell: powershell
        env:
          DiscordServerAudit_AUDIT_CHANNEL_ID: ${{ secrets.DiscordServerAudit_AUDIT_CHANNEL_ID }}
        run: |
          if (-not $env:DiscordServerAudit_AUDIT_CHANNEL_ID) { throw "Secret DiscordServerAudit_AUDIT_CHANNEL_ID is missing. Add it in Settings → Secrets → Actions." }
          setx DiscordServerAudit_AUDIT_CHANNEL_ID "$env:DiscordServerAudit_AUDIT_CHANNEL_ID" /M | Out-Null
          $m = [Environment]::GetEnvironmentVariable('DiscordServerAudit_AUDIT_CHANNEL_ID','Machine')
          if (-not $m) { throw "Failed to set machine env var DiscordServerAudit_AUDIT_CHANNEL_ID." }

      - name: Set DiscordServerAudit_GEMINI_KEY as machine env var
        shell: powershell
        env:
          DiscordServerAudit_GEMINI_KEY: ${{ secrets.DiscordServerAudit_GEMINI_KEY }}
        run: |
          if ($env:DiscordServerAudit_GEMINI_KEY) {
            setx DiscordServerAudit_GEMINI_KEY "$env:DiscordServerAudit_GEMINI_KEY" /M | Out-Null
          } else {
            Write-Host "DiscordServerAudit_GEMINI_KEY not set - Gemini features will be disabled."
          }

      - name: Set DiscordServerAudit_DB_PATH as machine env var
        shell: powershell
        run: |
          setx DiscordServerAudit_DB_PATH "$env:DiscordServerAudit_DB_PATH" /M | Out-Null

      # 5) Stop existing bot if running
      - name: Stop existing bot (if running)
        shell: powershell
        run: |
          $name = $env:DiscordServerAudit_APP_TASK
          if (Get-Command Stop-ScheduledTask -ErrorAction SilentlyContinue) {
            try { (Get-ScheduledTask -TaskName $name -ErrorAction Stop) | Stop-ScheduledTask -ErrorAction SilentlyContinue } catch {}
          } else {
            schtasks /end /tn $name 2>$null | Out-Null
          }
          $appDir = Join-Path $env:DiscordServerAudit_APP_ROOT 'src'
          Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
            Where-Object { $_.CommandLine -match 'bot\.py' -and $_.CommandLine -match [regex]::Escape($appDir) } |
            ForEach-Object { try { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } catch {} }

      # 6) Register and start scheduled task
      - name: Register/Start Scheduled Task
        run: |
          $exe  = "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe"
          $args = "-NoProfile -ExecutionPolicy Bypass -File `"$env:DiscordServerAudit_APP_ROOT\run-bot.ps1`""
          $action    = New-ScheduledTaskAction -Execute $exe -Argument $args -WorkingDirectory $env:DiscordServerAudit_APP_ROOT
          $trigger   = New-ScheduledTaskTrigger -AtStartup
          $principal = New-ScheduledTaskPrincipal -UserId "SYSTEM" -LogonType ServiceAccount -RunLevel Highest
          $settings  = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries `
                                                    -RestartCount 5 -RestartInterval (New-TimeSpan -Minutes 1)
          if (Get-ScheduledTask -TaskName $env:DiscordServerAudit_APP_TASK -ErrorAction SilentlyContinue) {
            schtasks /end /tn $env:DiscordServerAudit_APP_TASK 2>$null | Out-Null
            Unregister-ScheduledTask -TaskName $env:DiscordServerAudit_APP_TASK -Confirm:$false
          }
          Register-ScheduledTask -TaskName $env:DiscordServerAudit_APP_TASK -Action $action -Trigger $trigger -Principal $principal -Settings $settings | Out-Null
          schtasks /run /tn $env:DiscordServerAudit_APP_TASK | Out-Null

      # 7) Show task status
      - name: Task status
        run: schtasks /query /tn $env:DiscordServerAudit_APP_TASK /v /fo LIST
